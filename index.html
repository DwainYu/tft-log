<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="TFT 日志（TFT Log）—— 云顶之弈对局记录与训练分析工具：记录每一局，复盘每一步，持续提升。"
    />
    <meta name="application-name" content="TFT 日志" />
    <!-- Base-relative: this file is also built with base "./" for Bilibili Toy,
         where the page sits under an unknown nested path. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="manifest" href="./app.webmanifest" />
    <title>TFT 日志 · TFT Log</title>
    <script>
      // Apply the persisted theme before first paint so a dark-mode user
      // never sees a light flash. Default is light.
      try {
        if (localStorage.getItem("tft-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
